name: Publish Tony Rive website

on:
  push:
    branches: [main]
    paths:
      - "tony-rive/**"
      - ".github/workflows/tony-rive-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tony-rive-pages"
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Tony Rive
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only Tony Rive website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./tony-rive"
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
